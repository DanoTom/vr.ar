<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VR.AR</title>
<link rel="stylesheet" href="options.css">
</head>
<body>
<main>
  <div class="logo">VR<span>.AR</span></div>
  <h1 data-i18n="optTitle"></h1>

  <label class="row">
    <input type="checkbox" id="enabled">
    <span><strong data-i18n="autoShow"></strong><em data-i18n="optAutoHint"></em></span>
  </label>

  <section>
    <h2 data-i18n="optMutedTitle"></h2>
    <p class="hint" data-i18n="optMutedHint"></p>
    <ul id="muted"></ul>
    <p class="empty" id="emptyMuted" data-i18n="optMutedEmpty"></p>
  </section>

  <p class="foot"><a href="https://vr.ar/extension-privacidad" target="_blank" rel="noopener noreferrer" data-i18n="privacyPolicy"></a> · <a href="https://vr.ar/" target="_blank" rel="noopener noreferrer">vr.ar</a></p>
</main>
<script src="i18n.js"></script>
<script src="options.js"></script>
</body>
</html>
