<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VR.AR</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header>
  <span class="logo">VR<span>.AR</span></span>
  <span class="tag" id="siteBadge">—</span>
</header>

<main>
  <p class="what" data-i18n="popupWhat"></p>

  <label class="label" for="headset" data-i18n="yourHeadset"></label>
  <select id="headset" aria-describedby="headsetType"></select>
  <p class="type" id="headsetType"></p>

  <section class="now" id="now" aria-live="polite">
    <span class="dot" id="dot"></span>
    <div>
      <strong id="verdict" data-i18n="searching"></strong>
      <span id="detail"></span>
    </div>
  </section>

  <section class="grant" id="grant" hidden>
    <strong data-i18n="grantTitle"></strong>
    <p data-i18n="grantBody"></p>
    <button id="grantBtn" type="button" data-i18n="grantBtn"></button>
  </section>

  <section class="granted" id="granted" hidden>
    <span class="check" aria-hidden="true">✓</span>
    <div>
      <strong data-i18n="grantedTitle"></strong>
      <button id="revokeBtn" type="button" class="linkbtn" data-i18n="revokeBtn"></button>
    </div>
  </section>

  <label class="toggle">
    <input type="checkbox" id="enabled">
    <span data-i18n="autoShow"></span>
  </label>
</main>

<footer>
  <a href="https://vr.ar/" target="_blank" rel="noopener noreferrer">vr.ar</a>
  <span class="count" id="catalogCount"></span>
</footer>

<script src="i18n.js"></script>
<script src="../src/data.js"></script>
<script src="popup.js"></script>
</body>
</html>
